name: CI Security

on:
  push:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      # 使用 pip-audit 进行 SCA 扫描并直接生成 JSON 文件
      - name: Run SCA Scan (pip-audit)
        run: |
          pip-audit -r requirements.txt --format=json -o safety-report.json || true

      # 将报告输出到 Summary 页面以便直接查看截图
      - name: Print Report to Summary
        if: always()
        run: |
          if [ -f safety-report.json ]; then
            echo '### SCA Scan JSON Report' >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat safety-report.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "### Report Error" >> $GITHUB_STEP_SUMMARY
            echo "JSON report was not generated." >> $GITHUB_STEP_SUMMARY
          fi

      # 上传生成的 JSON 文件
      - name: Upload SCA Report
        uses: actions/upload-artifact@v7
        with:
          name: safety-report
          path: safety-report.json
          if-no-files-found: error
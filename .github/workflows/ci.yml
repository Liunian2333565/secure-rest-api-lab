name: CI Security

on:
  push:
  pull_request:

jobs:
  security:
    # 1. 将 runner 固定为 ubuntu-24.04，避免自动迁移到 Ubuntu 26 带来的不确定性
    runs-on: ubuntu-24.04
    steps:
      # 2. 升级 action 版本以使用 Node 24 运行时
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install safety

      # 3. 明确要求 Safety 生成 JSON 文件
      - name: Run Safety SCA Scan
        run: |
          safety scan --save-json safety-report.json || true

      # 4. 将 JSON 报告直接输出到 GitHub Actions Summary 页面，方便查看
      - name: Print Report to Summary
        if: always() # 即使上一步失败也执行，确保能看到错误信息
        run: |
          if [ -f safety-report.json ]; then
            echo '### Safety Scan JSON Report' >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat safety-report.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "### Safety Scan Report" >> $GITHUB_STEP_SUMMARY
            echo "safety-report.json was not generated." >> $GITHUB_STEP_SUMMARY
          fi

      # 5. 上传 artifact，并设置 if-no-files-found 以在文件缺失时报错
      - name: Upload Safety Report
        uses: actions/upload-artifact@v7
        with:
          name: safety-report
          path: safety-report.json
          if-no-files-found: error
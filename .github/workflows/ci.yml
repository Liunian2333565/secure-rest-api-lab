name: CI Security

on:
  push:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      # 1. SAST: Bandit 扫描源码，生成你想要的干净 JSON
      - name: Run SAST Scan (Bandit)
        run: |
          bandit -r . -f json -o bandit-report.json || true

      # 2. SCA: pip-audit 扫描依赖漏洞，生成 JSON
      - name: Run SCA Scan (pip-audit)
        run: |
          pip-audit -r requirements.txt --format=json -o sca-report.json || true

      # 3. 在页面直接预览两个报告
      - name: Print Reports to Summary
        if: always()
        run: |
          echo '### SAST (Bandit) JSON Report' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat bandit-report.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          echo '### SCA (pip-audit) JSON Report' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat sca-report.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # 4. 上传两个报告作为 Artifact
      - name: Upload Security Reports
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            bandit-report.json
            sca-report.json
          if-no-files-found: error